[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech2text"
version = "0.1.0"
description = "Offline speech-to-text with sherpa-onnx and Tkinter"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Sudipta Roy" }]
keywords = ["asr", "speech-to-text", "sherpa-onnx", "offline", "tkinter", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy==2.4.6",
  "sounddevice==0.5.6",
  "sherpa-onnx==1.13.8",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.urls]
Homepage = "https://github.com/Shudipto-creator/Offline-Real-Time-Speech-to-Text"
Repository = "https://github.com/Shudipto-creator/Offline-Real-Time-Speech-to-Text"
Issues = "https://github.com/Shudipto-creator/Offline-Real-Time-Speech-to-Text/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "requires_model: test requires the downloaded sherpa-onnx model files",
]
